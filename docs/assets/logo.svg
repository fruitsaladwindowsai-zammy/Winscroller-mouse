<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f74c00" stop-opacity="0.1"/>
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <radialGradient id="haloGlow" cx="44%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#7928ca" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Obsidian Rounded Backdrop -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="10"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#00f5d4" stroke-opacity="0.24" stroke-width="3"/>

  <!-- Halo Glow & Pulse Ring -->
  <circle cx="220" cy="186" r="165" fill="url(#haloGlow)"/>
  <circle cx="204" cy="158" r="98" fill="none" stroke="#00f5d4" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="204" cy="158" r="134" fill="none" stroke="#a855f7" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- Smooth Comet Ribbon Trail -->
  <path d="M 86 410 Q 170 365 206 270 Q 228 210 198 152" fill="none" stroke="url(#trailGrad)" stroke-width="34" stroke-linecap="round" opacity="0.35"/>
  <path d="M 96 402 Q 174 358 206 268 Q 226 212 198 152" fill="none" stroke="url(#trailGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- Sparkle Beads -->
  <circle cx="122" cy="368" r="9" fill="#f74c00" opacity="0.85"/>
  <circle cx="154" cy="316" r="11" fill="#a855f7" opacity="0.9"/>
  <circle cx="268" cy="126" r="7" fill="#00f5d4" opacity="0.85"/>

  <!-- Custom Forged Pointer Arrow -->
  <path d="M 188 120 L 188 342 L 246 286 L 288 378 L 328 360 L 286 268 L 364 265 Z"
        fill="url(#cursorGrad)" stroke="#0f172a" stroke-width="14" stroke-linejoin="round" filter="url(#drop)"/>
  <circle cx="222" cy="196" r="12" fill="#00f5d4"/>
</svg>
