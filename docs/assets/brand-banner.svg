<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="18%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="72%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRust" cx="86%" cy="84%" r="38%">
      <stop offset="0%" stop-color="#f74c00" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#f74c00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="58%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="trailStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f74c00" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="1"/>
    </linearGradient>
    <pattern id="latticeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="cardDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#latticeGrid)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glowCyan)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glowViolet)"/>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="url(#glowRust)"/>

  <!-- Left Brand Mark -->
  <g transform="translate(84, 72)" filter="url(#cardDrop)">
    <rect x="0" y="0" width="176" height="176" rx="38" fill="#0f172a" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="2.5"/>
    <circle cx="74" cy="58" r="44" fill="none" stroke="#00f5d4" stroke-opacity="0.32" stroke-width="3"/>
    <path d="M 32 146 Q 68 128 76 86 Q 82 68 70 50" fill="none" stroke="url(#trailStroke)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 68 38 L 68 122 L 90 100 L 106 135 L 122 128 L 106 94 L 136 92 Z" fill="#f8fafc" stroke="#07090e" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="81" cy="68" r="5" fill="#00f5d4"/>
  </g>

  <!-- Right Wordmark & Tagline -->
  <g transform="translate(300, 122)">
    <text x="0" y="0" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#wordmarkGrad)">Winscroller Mouse</text>
    <text x="2" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">Custom Cursor Forge &amp; GPU Pointer Effects for Windows 10 / 11</text>

    <g transform="translate(0, 72)" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="600">
      <rect x="0" y="0" width="176" height="32" rx="16" fill="#0f172a" stroke="#00f5d4" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="4" fill="#00f5d4"/>
      <text x="30" y="20" fill="#00f5d4">DirectComposition</text>

      <rect x="190" y="0" width="178" height="32" rx="16" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="208" cy="16" r="4" fill="#a855f7"/>
      <text x="220" y="20" fill="#d8b4fe">14×30×22 Forge</text>

      <rect x="382" y="0" width="184" height="32" rx="16" fill="#0f172a" stroke="#f74c00" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="400" cy="16" r="4" fill="#f74c00"/>
      <text x="412" y="20" fill="#fdba74">Pure Rust Win32</text>

      <rect x="580" y="0" width="186" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.2"/>
      <circle cx="598" cy="16" r="4" fill="#10b981"/>
      <text x="610" y="20" fill="#6ee7b7">~9.7 MB RAM</text>
    </g>
  </g>
</svg>
