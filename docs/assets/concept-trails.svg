<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="comet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f74c00" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="596" height="316" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="34" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f8fafc">6 GPU-Accelerated Pointer Trails (Catmull-Rom + Particle Physics)</text>

  <!-- 1. Comet -->
  <rect x="20" y="52" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <path d="M 38 130 Q 95 72 174 96" fill="none" stroke="url(#comet)" stroke-width="11" stroke-linecap="round"/>
  <circle cx="174" cy="96" r="6" fill="#00f5d4"/>
  <text x="32" y="154" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#00f5d4">Comet</text>

  <!-- 2. Ribbon -->
  <rect x="212" y="52" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <path d="M 228 128 C 265 65 315 145 366 86" fill="none" stroke="url(#ribbon)" stroke-width="16" stroke-linecap="round" opacity="0.28"/>
  <path d="M 228 128 C 265 65 315 145 366 86" fill="none" stroke="url(#ribbon)" stroke-width="6" stroke-linecap="round"/>
  <text x="224" y="154" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#d8b4fe">Ribbon</text>

  <!-- 3. Beads -->
  <rect x="404" y="52" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <circle cx="426" cy="126" r="2.5" fill="#7dcfff" opacity="0.35"/>
  <circle cx="448" cy="112" r="3.5" fill="#7dcfff" opacity="0.5"/>
  <circle cx="472" cy="98" r="4.5" fill="#a855f7" opacity="0.65"/>
  <circle cx="498" cy="92" r="5.5" fill="#a855f7" opacity="0.8"/>
  <circle cx="526" cy="95" r="6.5" fill="#00f5d4" opacity="0.9"/>
  <circle cx="556" cy="102" r="7.5" fill="#00f5d4"/>
  <text x="416" y="154" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#7dcfff">Beads</text>

  <!-- 4. Sparks -->
  <rect x="20" y="182" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <line x1="158" y1="216" x2="146" y2="226" stroke="#ff9e64" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="138" y1="224" x2="122" y2="238" stroke="#f74c00" stroke-width="2" stroke-linecap="round"/>
  <line x1="164" y1="234" x2="156" y2="250" stroke="#ffd36b" stroke-width="2" stroke-linecap="round"/>
  <line x1="112" y1="242" x2="96" y2="262" stroke="#f7768e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="88" y1="252" x2="74" y2="270" stroke="#f74c00" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <text x="32" y="284" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#fdba74">Sparks (Gravity)</text>

  <!-- 5. Echoes -->
  <rect x="212" y="182" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <circle cx="248" cy="244" r="18" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.35"/>
  <circle cx="286" cy="236" r="14" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.58"/>
  <circle cx="324" cy="228" r="10" fill="none" stroke="#00f5d4" stroke-width="2" opacity="0.8"/>
  <circle cx="356" cy="222" r="6" fill="none" stroke="#00f5d4" stroke-width="2.2"/>
  <text x="224" y="284" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#a855f7">Echoes</text>

  <!-- 6. Bubbles -->
  <rect x="404" y="182" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <circle cx="442" cy="214" r="12" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.55"/>
  <circle cx="438" cy="210" r="2.2" fill="#10b981" opacity="0.5"/>
  <circle cx="486" cy="230" r="9" fill="none" stroke="#00f5d4" stroke-width="1.5" opacity="0.75"/>
  <circle cx="483" cy="227" r="1.8" fill="#00f5d4" opacity="0.6"/>
  <circle cx="534" cy="244" r="6.5" fill="none" stroke="#7dcfff" stroke-width="1.5"/>
  <circle cx="532" cy="242" r="1.4" fill="#7dcfff"/>
  <text x="416" y="284" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Bubbles (Buoyancy)</text>
