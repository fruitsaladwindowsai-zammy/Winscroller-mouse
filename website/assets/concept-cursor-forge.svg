<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5f9e"/>
      <stop offset="33%" stop-color="#ffd36b"/>
      <stop offset="66%" stop-color="#6bd5ff"/>
      <stop offset="100%" stop-color="#a78bff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="596" height="316" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="34" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Procedural Cursor Forge (Pure Rust SVG -> Native .CUR / .ANI)</text>

  <!-- Pipeline Boxes -->
  <g font-family="'Segoe UI',sans-serif" font-size="12" text-anchor="middle">
    <rect x="24" y="60" width="122" height="72" rx="10" fill="#0b1120" stroke="#00f5d4" stroke-opacity="0.6"/>
    <text x="85" y="88" font-weight="700" fill="#00f5d4">14 Arrows</text>
    <text x="85" y="108" fill="#94a3b8" font-size="11">Classic..Feather</text>
    <text x="85" y="122" fill="#94a3b8" font-size="11">+ Tilt &amp; Round</text>

    <rect x="166" y="60" width="122" height="72" rx="10" fill="#0b1120" stroke="#a855f7" stroke-opacity="0.6"/>
    <text x="227" y="88" font-weight="700" fill="#d8b4fe">30 Surfaces</text>
    <text x="227" y="108" fill="#94a3b8" font-size="11">Holo, Marble, CRT</text>
    <text x="227" y="122" fill="#94a3b8" font-size="11">+ Fills &amp; Depth</text>

    <rect x="308" y="60" width="122" height="72" rx="10" fill="#0b1120" stroke="#f74c00" stroke-opacity="0.6"/>
    <text x="369" y="88" font-weight="700" fill="#fdba74">22 Lines</text>
    <text x="369" y="108" fill="#94a3b8" font-size="11">Neon, Glitch, Rope</text>
    <text x="369" y="122" fill="#94a3b8" font-size="11">+ 18 Ornaments</text>

    <rect x="450" y="60" width="126" height="72" rx="10" fill="#0b1120" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="513" y="88" font-weight="700" fill="#6ee7b7">resvg -> OS</text>
    <text x="513" y="108" fill="#94a3b8" font-size="11">32-bit .CUR + .ANI</text>
    <text x="513" y="122" fill="#94a3b8" font-size="11">SetSystemCursor</text>
  </g>

  <!-- Showcase Strip -->
  <rect x="24" y="156" width="276" height="136" rx="10" fill="#f1f5f9"/>
  <rect x="300" y="156" width="276" height="136" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="40" y="178" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#475569">LIGHT SURFACE PREVIEW</text>
  <text x="316" y="178" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#94a3b8">DARK SURFACE PREVIEW</text>

  <!-- Sample forged cursors -->
  <g transform="translate(64, 200)">
    <path d="M 0 0 L 0 48 L 12 36 L 20 54 L 28 50 L 20 33 L 36 32 Z" fill="#0f172a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(148, 200)">
    <path d="M 0 0 L 0 48 L 12 36 L 20 54 L 28 50 L 20 33 L 36 32 Z" fill="url(#holo)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(230, 204)">
    <circle cx="18" cy="22" r="16" fill="none" stroke="#7928ca" stroke-width="4" stroke-dasharray="32 14"/>
  </g>

  <g transform="translate(344, 200)">
    <path d="M 0 0 L 0 48 L 12 36 L 20 54 L 28 50 L 20 33 L 36 32 Z" fill="none" stroke="#00f5d4" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(428, 200)">
    <path d="M 0 0 L 0 48 L 12 36 L 20 54 L 28 50 L 20 33 L 36 32 Z" fill="url(#holo)" stroke="#f8fafc" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(508, 204)">
    <circle cx="18" cy="22" r="16" fill="none" stroke="#00f5d4" stroke-width="4" stroke-dasharray="34 12"/>
  </g>
</svg>
