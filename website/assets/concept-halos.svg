<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="596" height="316" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="34" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f8fafc">6 Pointer Halos + Shake-to-Find Radar Rings</text>

  <!-- Glow -->
  <rect x="20" y="52" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <circle cx="108" cy="102" r="38" fill="url(#glow)"/>
  <text x="32" y="154" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#00f5d4">Glow</text>

  <!-- Ring -->
  <rect x="212" y="52" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <circle cx="300" cy="102" r="26" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-width="2.5"/>
  <text x="224" y="154" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#d8b4fe">Ring</text>

  <!-- Pulse -->
  <rect x="404" y="52" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <circle cx="492" cy="102" r="18" fill="none" stroke="#00f5d4" stroke-width="2.2"/>
  <circle cx="492" cy="102" r="34" fill="none" stroke="#a855f7" stroke-width="1.6" opacity="0.5"/>
  <text x="416" y="154" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#7dcfff">Pulse</text>

  <!-- Spotlight -->
  <rect x="20" y="182" width="176" height="114" rx="10" fill="#03050a" stroke="#1e293b"/>
  <circle cx="108" cy="232" r="30" fill="#1e293b" stroke="#00f5d4" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="32" y="284" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Spotlight</text>

  <!-- Crosshair -->
  <rect x="212" y="182" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <line x1="224" y1="232" x2="286" y2="232" stroke="#f7768e" stroke-width="1.5"/>
  <line x1="314" y1="232" x2="376" y2="232" stroke="#f7768e" stroke-width="1.5"/>
  <line x1="300" y1="190" x2="300" y2="218" stroke="#f7768e" stroke-width="1.5"/>
  <line x1="300" y1="246" x2="300" y2="274" stroke="#f7768e" stroke-width="1.5"/>
  <text x="224" y="284" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#f7768e">Crosshair</text>

  <!-- Target -->
  <rect x="404" y="182" width="176" height="114" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <g transform="translate(492,232) rotate(18)" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M -22 -10 V -22 H -10"/>
    <path d="M 10 -22 H 22 V -10"/>
    <path d="M 22 10 V 22 H 10"/>
    <path d="M -10 22 H -22 V 10"/>
  </g>
  <text x="416" y="284" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Target (Rotating)</text>
</svg>
